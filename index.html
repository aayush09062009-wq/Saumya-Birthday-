<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Something ♡</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Floating stickers -->
    <div class="stickers">

        <span class="sticker s1">♡</span>
        <span class="sticker s2">✦</span>
        <span class="sticker s3">🍒</span>
        <span class="sticker s4">✿</span>
        <span class="sticker s5">♡</span>
        <span class="sticker s6">🦋</span>
        <span class="sticker s7">✧</span>
        <span class="sticker s8">🌷</span>
        <span class="sticker s9">♡</span>
        <span class="sticker s10">☁</span>

    </div>


    <!-- PAGE 1 -->

    <main class="opening-page">

        <div class="opening-content">

            <p class="eyebrow">
                just a little pause
            </p>

            <div class="tiny-line"></div>

            <h1>
                There's a little<br>
                <em>something</em><br>
                here for you.
            </h1>

            <p class="subtitle">
                Some things are better<br>
                discovered slowly.
            </p>

            <button id="openButton" class="open-button">
                open it&nbsp; →
            </button>

        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
