<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Make a Wish 🎂</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Floating stickers -->
    <div class="stickers">

        <span class="sticker s1">✦</span>
        <span class="sticker s2">♡</span>
        <span class="sticker s3">✿</span>
        <span class="sticker s4">✨</span>
        <span class="sticker s5">♡</span>
        <span class="sticker s6">🌷</span>

    </div>


    <!-- PAGE 3 -->

    <main class="cake-page">

        <div class="cake-content">

            <p class="eyebrow">
                one little tradition
            </p>

            <div class="tiny-line"></div>

            <h1>
                Make a<br>
                <em>wish.</em>
            </h1>

            <p class="cake-subtitle">
                Make a wish first.<br>
                Then cut the cake.
            </p>


            <!-- CAKE AREA -->

            <div id="cakeArea" class="cake-area">

                <!-- Knife -->
                <div id="knife" class="knife">
                    🔪
                </div>


                <!-- Cake -->

                <div id="cake" class="cake">


                    <!-- Candles -->

                    <div class="candle candle1">
                        <div class="flame"></div>
                    </div>

                    <div class="candle candle2">
                        <div class="flame"></div>
                    </div>

                    <div class="candle candle3">
                        <div class="flame"></div>
                    </div>


                    <!-- Cake top -->

                    <div class="cake-top">

                        <span>
                            Happy Birthday<br>
                            Saumya ♡
                        </span>

                    </div>


                    <!-- Cake body -->

                    <div class="cake-body">

                        <div class="cream cream1"></div>
                        <div class="cream cream2"></div>
                        <div class="cream cream3"></div>

                    </div>


                    <!-- Cake base -->

                    <div class="cake-base"></div>

                </div>

            </div>


            <!-- STEP 1 -->

            <p id="blowText" class="swipe-text">
                click to blow the candles ✦
            </p>


            <!-- STEP 2 -->

            <p id="cutText" class="swipe-text cut-instruction">
                swipe across the cake to cut it →
            </p>


            <!-- FINAL MESSAGE -->

            <div id="cutMessage" class="cut-message">

                <p>
                    and just like that...
                </p>

                <h2>
                    wish granted ♡
                </h2>

                <button
                    class="open-button show"
                    onclick="window.location.href='page4.html'">

                    there's one last thing&nbsp; →

                </button>

            </div>

        </div>

    </main>


    <script src="cake.js"></script>

</body>
</html>
